name: MMM Studio App CI

on:
  push:
    paths:
      - "src/app/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "src/app/**"
      - ".github/workflows/app-ci.yml"

jobs:
  backend:
    name: Backend Lint & Fast Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mmm
          POSTGRES_PASSWORD: mmm
          POSTGRES_DB: mmm_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: src/app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "src/app/backend/uv.lock"
      - name: Install Python 3.12 & dependencies
        run: uv sync --frozen
      - name: Run Ruff check
        run: uv run ruff check mmm_studio tests
      - name: Run Fast Test Suite
        env:
          TEST_DATABASE_URL: postgresql://mmm:mmm@localhost:5432/mmm_studio_test
        run: uv run pytest tests/ -m "not slow" -v

  frontend:
    name: Frontend Typecheck & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "src/app/frontend/package-lock.json"
      - name: Install dependencies
        run: npm install
      - name: Typecheck & Build production bundle
        run: npm run build
