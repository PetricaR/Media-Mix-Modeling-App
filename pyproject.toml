[project]
name = "tchibo-marketing-sales-prediction"
version = "0.1.0"
description = "Tchibo case study: forecast daily total sales from marketing spend (MAE / mean sales <= 15%)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<2.4",
    "openpyxl>=3.1",
    "matplotlib>=3.9,<3.11",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14.5,<0.15",
    "lightgbm>=4.5",
    "holidays>=0.60",
]

[project.scripts]
tchibo-forecast = "tchibo_mmm.forecast:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "ruff>=0.6",
    "pytest>=8.0",
]
# Bayesian MMM (Google Meridian) - heavy: pulls TensorFlow + JAX.
mmm = [
    "google-meridian[schema]==2.1.0",
]
weather = [
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
]
# MMM Studio backend (src/app/backend), installed editable into this .venv with its `worker` extra and
# the test client, so the notebooks and the app share one environment. The backend keeps its own
# pyproject.toml and uv.lock for the Docker images and CI.
app = [
    "mmm-studio[worker]",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tchibo_mmm"]

[tool.uv]
# Every group is a default: `uv sync` is exact, so a sync without one of them uninstalls it from .venv.
default-groups = ["dev", "mmm", "weather", "app"]

[tool.uv.sources]
mmm-studio = { path = "src/app/backend", editable = true }

[tool.ruff]
line-length = 100
